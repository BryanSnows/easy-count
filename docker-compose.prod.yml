version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: easy-count-db-prod
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-prodpass123}
      - POSTGRES_DB=postgres
      - ENVIRONMENT=prod
      - APP_DB_NAME=easy_count
    ports:
      - "5432:5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ./script/setup-db.sh:/docker-entrypoint-initdb.d/10-setup-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: easy-count-app-prod
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/easy_count
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-prodpass123}
      - SPRING_FLYWAY_ENABLED=true
      - SPRING_FLYWAY_LOCATIONS=classpath:db/migration
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_JPA_SHOW_SQL=false
    ports:
      - "8082:8080"

volumes:
  pgdata_prod:
# Overrides para ambiente de desenvolvimento
# Estas propriedades podem ser sobrescritas via variáveis de ambiente

# Mostrar SQL em dev por padrão
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
# Não deixar o Hibernate criar/alterar schema (usamos Flyway)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}

# Porta do servidor (pode ser sobrescrita via env SERVER_PORT)
server.port=${SERVER_PORT:8080}

# Logging mais verboso em dev
logging.level.org.springframework.web=${LOG_LEVEL_SPRING_WEB:INFO}
logging.level.org.hibernate.SQL=${LOG_LEVEL_HIBERNATE_SQL:DEBUG}
logging.level.org.hibernate.orm.jdbc.bind=${LOG_LEVEL_HIBERNATE_BIND:TRACE}

