spring.application.name=easy-count

# Banco de dados (assumido: Postgres local)
spring.datasource.url=jdbc:postgresql://localhost:5438/axion
spring.datasource.username=postgres
spring.datasource.password=pass123
spring.datasource.driver-class-name=org.postgresql.Driver

# Usar Flyway para migrações de esquema; desabilitar auto-ddl do Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Flyway
## Workaround temporário: desabilitávamos o Flyway para evitar o erro "Unsupported Database: PostgreSQL 16.9" ao iniciar.
## Correção de longo prazo: atualizar o flyway-core (ou o driver JDBC) para uma versão que suporte PostgreSQL 16.
## Flyway ativado: executa as migrações ao iniciar a aplicação. O Flyway é idempotente e
## registra migrações aplicadas na tabela flyway_schema_history, então executar novamente é seguro.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Configurações de desenvolvimento
spring.profiles.active=dev
